<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🦞 Servestacean</title>
  <style>
    :root {
      --bs-body-bg: #1a1a1a;
      --accent: #e85d3a;
      --accent-light: #ff7f5c;
    }
    body { background: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-light); border-color: var(--accent-light); color: #fff; }
    .btn-outline-accent { border-color: var(--accent); color: var(--accent); }
    .btn-outline-accent:hover { background: var(--accent); color: #fff; }
    .deploy-log {
      background: #0d0d0d;
      color: #c8c8c8;
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.85rem;
      padding: 1rem;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid #333;
      border-radius: 0.375rem;
    }
    .card { border-color: #333; }
    .navbar { border-bottom: 2px solid var(--accent); }
    .commit-badge { font-family: monospace; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="bundle.js"></script>
</body>
</html>
